<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10283f" />
    <title>中華民國成立＝共和中國？</title>
    <meta name="description" content="逐件歷史事件評估民初中國的共和發展，建立你的共和指數折線圖。" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310283f'/%3E%3Cpath d='M14 43h36M18 39l9-11 8 6 11-16' fill='none' stroke='%23f2c14e' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <style>
      :root {
        --ink: #10283f;
        --paper: #f4f0e8;
        --card: #fffdf8;
        --muted: #657383;
        --line: #d8d3c8;
        --gold: #f2c14e;
        --red: #bd3b3b;
        --blue: #2f6f9f;
        --green: #1e7a58;
        --shadow: 0 14px 40px rgba(16, 40, 63, 0.12);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(rgba(16, 40, 63, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(16, 40, 63, 0.035) 1px, transparent 1px),
          var(--paper);
        background-size: 24px 24px;
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.55;
      }

      button { font: inherit; }
      .masthead {
        background: var(--ink);
        color: white;
        border-bottom: 5px solid var(--gold);
      }
      .masthead-inner, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
      .masthead-inner { padding: 30px 0 26px; }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 8px;
        color: #d6e2ec;
        font-weight: 700;
        letter-spacing: .14em;
        font-size: .82rem;
      }
      .eyebrow::before { content: ""; width: 28px; height: 3px; background: var(--gold); }
      h1 { margin: 0; max-width: 820px; font-size: clamp(2rem, 5vw, 4rem); line-height: 1.12; letter-spacing: -.045em; }
      .intro { margin: 12px 0 0; max-width: 760px; color: #d8e2eb; font-size: 1.04rem; }

      main { padding: 28px 0 72px; }
      .rule {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 14px;
        align-items: start;
        padding: 18px 20px;
        background: #fff7d8;
        border: 1px solid #e1c65f;
        border-left: 6px solid var(--gold);
        box-shadow: 0 8px 24px rgba(16, 40, 63, .07);
      }
      .rule-icon {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--ink);
        color: white;
        font-weight: 900;
      }
      .rule strong { display: block; margin-bottom: 3px; }
      .rule p { margin: 0; }

      .section { margin-top: 28px; }
      .section-heading {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-bottom: 12px;
      }
      .section-kicker { margin: 0 0 3px; color: var(--red); font-weight: 800; letter-spacing: .08em; font-size: .78rem; }
      h2 { margin: 0; font-size: clamp(1.35rem, 3vw, 2rem); line-height: 1.2; }
      .section-help { margin: 0; color: var(--muted); text-align: right; }

      .table-shell, .chart-card {
        overflow: hidden;
        background: var(--card);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      table { width: 100%; border-collapse: collapse; }
      th {
        padding: 13px 16px;
        color: white;
        background: #173854;
        text-align: left;
        font-size: .9rem;
        letter-spacing: .05em;
      }
      th:last-child { text-align: center; }
      td { padding: 13px 16px; border-top: 1px solid #e8e3d9; vertical-align: middle; }
      tbody tr:first-child td { border-top: 0; }
      tbody tr:hover { background: #f8f4eb; }
      .event-cell { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center; }
      .event-no {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border: 1px solid #bdc5cb;
        border-radius: 50%;
        color: var(--muted);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .event-title { font-weight: 700; }
      .score-picker {
        display: inline-grid;
        grid-template-columns: 44px 58px 44px;
        align-items: stretch;
        border: 1px solid #aeb8c0;
        border-radius: 9px;
        overflow: hidden;
        background: white;
      }
      .step-btn {
        min-height: 44px;
        border: 0;
        color: white;
        cursor: pointer;
        font-size: 1.35rem;
        font-weight: 900;
        transition: filter .12s ease, background .12s ease;
      }
      .step-btn.decrement { background: var(--red); }
      .step-btn.increment { background: var(--green); }
      .step-btn:hover:not(:disabled) { filter: brightness(.88); }
      .step-btn:focus-visible { position: relative; z-index: 1; outline: 3px solid rgba(47, 111, 159, .45); outline-offset: -3px; }
      .step-btn:disabled { background: #c8cdd1; cursor: not-allowed; }
      .score-value {
        display: grid;
        place-items: center;
        min-height: 44px;
        border-left: 1px solid #d7dde1;
        border-right: 1px solid #d7dde1;
        font-size: 1.15rem;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
      }

      .chart-card { padding: 20px; }
      .chart-topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        margin-bottom: 12px;
      }
      .result-block { display: flex; align-items: baseline; gap: 10px; }
      .result-label { color: var(--muted); font-weight: 700; }
      .result-number { font-size: 2.6rem; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; }
      .result-number.positive { color: var(--green); }
      .result-number.negative { color: var(--red); }
      .reset-btn {
        padding: 9px 14px;
        border: 1px solid #aeb8c0;
        border-radius: 7px;
        background: white;
        color: var(--ink);
        cursor: pointer;
        font-weight: 750;
      }
      .reset-btn:hover { background: #eef2f5; }
      .chart-scroll { overflow-x: auto; padding-bottom: 4px; }
      #chart { display: block; width: 1580px; height: 375px; }
      .gridline { stroke: #ded9cf; stroke-width: 1; }
      .axisline { stroke: #94a0aa; stroke-width: 1.4; }
      .zeroline { stroke: #536b7e; stroke-width: 2; stroke-dasharray: 5 5; }
      .axis-label { fill: #657383; font-size: 12px; font-weight: 700; }
      .series-shadow { fill: none; stroke: rgba(16, 40, 63, .11); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .series { fill: none; stroke: var(--blue); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .point { fill: var(--card); stroke: var(--blue); stroke-width: 3; }
      .point.latest { fill: var(--gold); stroke: var(--ink); }
      .chart-labels { position: relative; width: 1580px; height: 126px; border-top: 1px solid #d8d3c8; }
      .chart-event-label {
        position: absolute;
        top: 10px;
        width: 98px;
        transform: translateX(-50%);
        color: #536170;
        font-size: .78rem;
        line-height: 1.35;
        text-align: center;
      }
      .chart-event-label.start { width: 60px; font-weight: 800; }
      .chart-event-no {
        display: grid;
        place-items: center;
        width: 23px;
        height: 23px;
        margin: 0 auto 5px;
        border-radius: 50%;
        background: var(--ink);
        color: white;
        font-size: .72rem;
        font-weight: 900;
      }
      .chart-caption { margin: 10px 0 0; color: var(--muted); font-size: .9rem; }
      .legend { display: flex; flex-wrap: wrap; gap: 12px 22px; margin-top: 16px; color: var(--muted); font-size: .9rem; }
      .legend span { display: inline-flex; align-items: center; gap: 7px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; }
      .dot.up { background: var(--green); }
      .dot.down { background: var(--red); }
      .dot.same { background: var(--muted); }
      .completion { margin: 0; color: var(--muted); font-weight: 700; }

      footer { margin-top: 28px; color: var(--muted); font-size: .88rem; text-align: center; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

      @media (max-width: 760px) {
        .masthead-inner, main { width: min(100% - 20px, 1180px); }
        .masthead-inner { padding: 24px 0 22px; }
        .section-heading, .chart-topline { align-items: flex-start; flex-direction: column; }
        .section-help { text-align: left; }
        .table-shell { overflow-x: auto; }
        table { min-width: 720px; }
        th, td { padding: 11px 10px; }
        .score-picker { grid-template-columns: 42px 54px 42px; }
        .chart-card { padding: 15px 10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <p class="eyebrow">民初共和發展判斷</p>
        <h1>中華民國成立＝共和中國？</h1>
        <p class="intro">逐件事件作出判斷，看看你眼中的共和中國是前進，還是倒退。</p>
      </div>
    </header>

    <main>
      <aside class="rule" aria-label="判斷規則">
        <span class="rule-icon" aria-hidden="true">!</span>
        <div>
          <strong>不要用「上帝視角」</strong>
          <p>每次只按當時已發生的事情判斷，不要因為知道袁世凱後來稱帝，就預先判定較早的事件必然破壞共和。</p>
        </div>
      </aside>

      <section class="section" aria-labelledby="events-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">第一部分</p>
            <h2 id="events-title">為每件事件評分</h2>
          </div>
          <p class="section-help">按「−」或「＋」每次調整 1 分（−3 至 +3）</p>
        </div>
        <div class="table-shell">
          <table>
            <thead>
              <tr><th scope="col">歷史事件</th><th scope="col">共和指數變化</th></tr>
            </thead>
            <tbody id="events-body"></tbody>
          </table>
        </div>
      </section>

      <section class="section" aria-labelledby="chart-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">第二部分</p>
            <h2 id="chart-title">你的共和指數路線</h2>
          </div>
          <p class="completion" id="completion">已評分 0／14 項</p>
        </div>
        <div class="chart-card">
          <div class="chart-topline">
            <div class="result-block">
              <span class="result-label">目前指數</span>
              <strong class="result-number" id="result-number">0</strong>
            </div>
            <button class="reset-btn" id="reset" type="button">重新評分</button>
          </div>
          <div class="chart-scroll" tabindex="0" aria-label="共和指數折線圖，可左右捲動">
            <svg id="chart" viewBox="0 0 1580 375" role="img" aria-labelledby="chart-svg-title chart-svg-desc">
              <title id="chart-svg-title">共和指數折線圖</title>
              <desc id="chart-svg-desc">折線由零開始，依照十四件歷史事件的評分逐步變化。</desc>
            </svg>
            <div class="chart-labels" id="chart-labels" aria-label="折線圖事件名稱"></div>
          </div>
          <p class="chart-caption">每個節點下方列出對應事件。累積指數到達上限或下限後，會維持在 +10 或 −10。</p>
          <div class="legend" aria-hidden="true">
            <span><i class="dot up"></i>推動共和</span>
            <span><i class="dot same"></i>影響中性</span>
            <span><i class="dot down"></i>破壞共和</span>
          </div>
          <p class="sr-only" id="live-result" aria-live="polite"></p>
        </div>
      </section>

      <footer>事件是已核證的歷史脈絡；共和指數是你的歷史判斷，並非唯一標準答案。</footer>
    </main>

    <script>
      const events = [
        "中華民國成立",
        "袁迫清帝退位",
        "袁獲推選為臨時大總統，在北京就職",
        "《臨時約法》頒布",
        "宋教仁被刺殺",
        "簽訂善後大借款",
        "袁罷免三名都督，二次革命爆發",
        "袁世凱迫使國會選他為正式大總統",
        "袁解散國會",
        "袁廢除《臨時約法》，頒布《中華民國約法》",
        "袁為爭取日本支持，接受「二十一條」的要求",
        "袁成立籌安會鼓吹君主立憲",
        "袁世凱稱帝",
        "護國之役爆發"
      ];

      const choices = [-3, -2, -1, 0, 1, 2, 3];
      const scores = Array(events.length).fill(null);
      const tbody = document.querySelector("#events-body");
      const chart = document.querySelector("#chart");
      const chartLabels = document.querySelector("#chart-labels");
      const resultNumber = document.querySelector("#result-number");
      const completion = document.querySelector("#completion");
      const liveResult = document.querySelector("#live-result");

      function signed(value) {
        return value > 0 ? `+${value}` : `${value}`;
      }

      function renderRows() {
        tbody.innerHTML = events.map((event, index) => `
          <tr>
            <td>
              <div class="event-cell">
                <span class="event-no">${index + 1}</span>
                <span class="event-title">${event}</span>
              </div>
            </td>
            <td>
              <div class="score-picker" role="group" aria-label="事件 ${index + 1}：${event} 的共和指數變化">
                <button type="button" class="step-btn decrement" data-event="${index}" data-delta="-1" aria-label="事件 ${index + 1} 減 1 分">−</button>
                <output class="score-value" id="score-${index}" aria-label="目前分數">0</output>
                <button type="button" class="step-btn increment" data-event="${index}" data-delta="1" aria-label="事件 ${index + 1} 加 1 分">＋</button>
              </div>
            </td>
          </tr>
        `).join("");
      }

      function cumulativeScores() {
        let current = 0;
        return scores.map(score => {
          if (score !== null) current = Math.max(-10, Math.min(10, current + score));
          return current;
        });
      }

      function renderChart() {
        const values = [0, ...cumulativeScores()];
        const left = 60, right = 1550, top = 25, bottom = 335;
        const x = i => left + (i / 14) * (right - left);
        const y = value => top + ((10 - value) / 20) * (bottom - top);
        const gridValues = [10, 5, 0, -5, -10];
        const points = values.map((value, index) => `${x(index)},${y(value)}`).join(" ");
        const lastRated = scores.reduce((last, score, index) => score === null ? last : index + 1, 0);

        chart.innerHTML = `
          <title id="chart-svg-title">共和指數折線圖</title>
          <desc id="chart-svg-desc">目前共和指數為 ${values[values.length - 1]}，已評分 ${scores.filter(v => v !== null).length} 項。</desc>
          ${gridValues.map(value => `<line class="${value === 0 ? "zeroline" : "gridline"}" x1="${left}" x2="${right}" y1="${y(value)}" y2="${y(value)}"/><text class="axis-label" x="46" y="${y(value) + 4}" text-anchor="end">${signed(value)}</text>`).join("")}
          <line class="axisline" x1="${left}" x2="${left}" y1="${top}" y2="${bottom}"/>
          <line class="axisline" x1="${left}" x2="${right}" y1="${bottom}" y2="${bottom}"/>
          <polyline class="series-shadow" points="${points}"/>
          <polyline class="series" points="${points}"/>
          ${values.map((value, i) => `<circle class="point ${i === lastRated ? "latest" : ""}" cx="${x(i)}" cy="${y(value)}" r="${i === lastRated ? 7 : 5}"><title>${i === 0 ? "起點" : `事件 ${i}`}：${signed(value)}</title></circle>`).join("")}
          <text class="axis-label" x="${left}" y="365">遠離共和</text>
          <text class="axis-label" x="${right}" y="365" text-anchor="end">走向共和</text>
        `;

        chartLabels.innerHTML = `<span class="chart-event-label start" style="left:${x(0)}px">起點</span>` + events.map((event, index) => `
          <span class="chart-event-label" style="left:${x(index + 1)}px">
            <b class="chart-event-no">${index + 1}</b>${event}
          </span>
        `).join("");

        const finalScore = values[values.length - 1];
        resultNumber.textContent = signed(finalScore);
        resultNumber.className = `result-number ${finalScore > 0 ? "positive" : finalScore < 0 ? "negative" : ""}`;
        const rated = scores.filter(value => value !== null).length;
        completion.textContent = `已評分 ${rated}／${events.length} 項`;
        liveResult.textContent = `目前共和指數 ${signed(finalScore)}，已評分 ${rated} 項。`;
      }

      function setScore(index, value, announce = true) {
        if (!Number.isInteger(index) || index < 0 || index >= events.length || !choices.includes(value)) {
          throw new Error("事件編號或分數無效");
        }
        scores[index] = value;
        document.querySelector(`#score-${index}`).textContent = signed(value);
        document.querySelector(`[data-event="${index}"][data-delta="-1"]`).disabled = value <= -3;
        document.querySelector(`[data-event="${index}"][data-delta="1"]`).disabled = value >= 3;
        renderChart();
        if (announce) liveResult.textContent = `事件 ${index + 1} 已評為 ${signed(value)}。目前共和指數 ${resultNumber.textContent}。`;
      }

      function resetScores() {
        scores.fill(null);
        document.querySelectorAll(".score-value").forEach(output => output.textContent = "0");
        document.querySelectorAll(".step-btn").forEach(button => button.disabled = false);
        renderChart();
        liveResult.textContent = "所有評分已重設。";
      }

      renderRows();
      renderChart();

      tbody.addEventListener("click", event => {
        const button = event.target.closest(".step-btn");
        if (!button) return;
        const index = Number(button.dataset.event);
        const current = scores[index] ?? 0;
        setScore(index, Math.max(-3, Math.min(3, current + Number(button.dataset.delta))));
      });
      document.querySelector("#reset").addEventListener("click", resetScores);

      function registerWebMCP() {
        const context = document.modelContext;
        if (!context?.registerTool) return;
        const controller = new AbortController();
        const common = { signal: controller.signal };
        try {
          void Promise.resolve(context.registerTool({
            name: "set_republic_scores",
            title: "設定共和指數評分",
            description: "一次設定一項或多項歷史事件的共和指數評分，並更新頁面的折線圖。事件編號為 1 至 14，分數為 -3 至 +3。",
            inputSchema: {
              type: "object",
              properties: {
                ratings: {
                  type: "array",
                  minItems: 1,
                  items: {
                    type: "object",
                    properties: { eventNumber: { type: "integer", minimum: 1, maximum: 14 }, score: { type: "integer", minimum: -3, maximum: 3 } },
                    required: ["eventNumber", "score"],
                    additionalProperties: false
                  }
                }
              },
              required: ["ratings"],
              additionalProperties: false
            },
            annotations: { readOnlyHint: false, untrustedContentHint: false },
            execute(input) {
              if (!input || !Array.isArray(input.ratings) || input.ratings.length === 0) throw new Error("ratings 必須是非空陣列");
              input.ratings.forEach(item => setScore(item.eventNumber - 1, item.score, false));
              return { updated: input.ratings.length, currentIndex: Number(resultNumber.textContent), rated: scores.filter(v => v !== null).length };
            }
          }, common)).catch(() => {});
          void Promise.resolve(context.registerTool({
            name: "reset_republic_scores",
            title: "重設共和指數評分",
            description: "清除全部十四項評分，並把共和指數折線圖還原到起點。",
            inputSchema: { type: "object", properties: {}, additionalProperties: false },
            annotations: { readOnlyHint: false, untrustedContentHint: false },
            execute() { resetScores(); return { reset: true, currentIndex: 0 }; }
          }, common)).catch(() => {});
        } catch (_) {}
      }
      registerWebMCP();
    </script>
  </body>
</html>
